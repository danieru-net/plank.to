# Create a daily routine and a weekday routine from the Routines tab, then check the list and Today.
# The time comes from the native picker; "Choose a time" sets its 09:00 starting value.
appId: to.plank.app
---
- runFlow:
    file: helpers/launch.yaml
    env:
      SCENARIO: empty
- tapOn:
    id: 'tab-routines'
- assertVisible: 'No routines yet'
# Daily routine, from the empty state
- tapOn:
    text: 'Add a routine'
    index: 1
- assertVisible: 'New routine'
- tapOn: 'What would you like to repeat?'
- inputText: 'Maestro daily walk'
- hideKeyboard
- tapOn: 'Choose a time for Time'
- tapOn: 'Every day'
- tapOn: 'Save routine'
- assertVisible: 'Edit Maestro daily walk, 09:00, every day'
# Weekday routine (Monday to Friday) with the Weekdays shortcut, from the header button
- tapOn:
    text: 'Add a routine'
    index: 0
- tapOn: 'What would you like to repeat?'
- inputText: 'Maestro weekday review'
- hideKeyboard
- tapOn: 'Choose a time for Time'
- tapOn: 'Weekdays'
- tapOn: 'Save routine'
- assertVisible: 'Edit Maestro weekday review, 09:00, Monday, Tuesday, Wednesday, Thursday, Friday'
- assertVisible: 'Edit Maestro daily walk.*'
# The daily routine is on Today.
- tapOn:
    id: 'tab-today'
- assertVisible: '.*Maestro daily walk.*'
